<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Товары</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: var(--color-background-primary, #ffffff);
    --bg-soft: var(--color-background-secondary, #f4f3ef);
    --text: var(--color-text-primary, #1a1a1a);
    --muted: var(--color-text-secondary, #5c5a53);
    --border: var(--color-border-primary, #e3e0d7);
    --chip: #f1efe9;
    --img: #eeeff1;
    --accent: #1a1a1a;
    --accent-text: #ffffff;
    --star: #d9930d;
    --font: var(--font-sans, Inter, system-ui, -apple-system, "Segoe UI", sans-serif);
  }
  html[data-theme="dark"] {
    --bg: var(--color-background-primary, #1f1f1e);
    --bg-soft: var(--color-background-secondary, #2a2a28);
    --text: var(--color-text-primary, #f2f1ec);
    --muted: var(--color-text-secondary, #b4b2a9);
    --border: var(--color-border-primary, #3a3936);
    --chip: #2f2e2b;
    --img: #2c2d30;
    --accent: #f2f1ec;
    --accent-text: #1a1a1a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }
  body { font-family: var(--font); color: var(--text); font-size: 14px; }
  .wrap { background: var(--bg); border: 1px solid var(--border); border-radius: 16px; padding: 16px 16px 12px; display: flex; flex-direction: column; gap: 14px; }
  .head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
  .title { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .title h1 { font-size: 16px; font-weight: 600; margin: 0; }
  .chip { font-size: 12px; color: var(--muted); background: var(--chip); border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .sep { width: 1px; height: 22px; background: var(--border); margin: 0 4px; }
  .pill { height: 32px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: 500 13px var(--font); cursor: pointer; }
  .pill[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .rail { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x proximity; }
  .rail::-webkit-scrollbar { height: 8px; }
  .rail::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
  .card { flex: 0 0 216px; scroll-snap-align: start; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); }
  .pic { position: relative; height: 150px; background: var(--img); display: flex; align-items: center; justify-content: center; }
  .pic img { width: 100%; height: 100%; object-fit: contain; background: #ffffff; }
  .badges { position: absolute; top: 8px; left: 8px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  .badge { font-size: 11px; font-weight: 600; border-radius: 999px; padding: 3px 8px; background: #1a1a1a; color: #ffffff; }
  .badge.price { background: #e9f3ea; color: #1e5b2a; }
  .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 5px; flex: 1; }
  .name { font-size: 13.5px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 35px; }
  .rating { display: flex; align-items: center; gap: 4px; font-size: 12.5px; }
  .rating .count, .src, .sub { color: var(--muted); }
  .price-now { font-size: 19px; font-weight: 700; margin-top: 2px; }
  .sub, .src { font-size: 12px; }
  .grow { flex: 1; }
  .open { margin-top: 6px; height: 40px; border-radius: 10px; border: 0; background: var(--accent); color: var(--accent-text); font: 600 13.5px var(--font); cursor: pointer; }
  .foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; font-size: 12px; color: var(--muted); }
  .empty { color: var(--muted); padding: 24px 4px; text-align: center; }
  .skel { flex: 0 0 216px; height: 300px; border-radius: 12px; background: var(--bg-soft); animation: pulse 1.2s ease-in-out infinite; }
  .open.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); margin-top: 0; }
  .card { cursor: pointer; }
  .detail { display: flex; flex-direction: column; gap: 14px; }
  .back { align-self: flex-start; height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: 500 13px var(--font); cursor: pointer; }
  .dtop { display: flex; flex-wrap: wrap; gap: 18px; }
  .dpic { flex: 0 0 260px; max-width: 100%; height: 260px; border-radius: 12px; background: #ffffff; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .dpic img { width: 100%; height: 100%; object-fit: contain; }
  .dinfo { flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .dinfo h2 { margin: 0; font-size: 18px; line-height: 1.3; }
  .dprice { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .dprice .now { font-size: 26px; font-weight: 700; }
  .dprice .old { color: var(--muted); text-decoration: line-through; }
  .dprice .off { font-size: 12px; font-weight: 600; color: #1e5b2a; background: #e9f3ea; border-radius: 999px; padding: 3px 8px; }
  .meta { color: var(--muted); font-size: 13px; }
  .bars { display: flex; flex-direction: column; gap: 4px; max-width: 320px; }
  .bar { display: grid; grid-template-columns: 22px 1fr 44px; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .bar .track { height: 6px; border-radius: 6px; background: var(--chip); overflow: hidden; }
  .bar .fill { height: 100%; background: var(--star); }
  .desc { font-size: 13.5px; line-height: 1.5; white-space: pre-line; }
  .sec { font-size: 15px; font-weight: 600; margin: 4px 0 0; }
  .reviews { display: flex; flex-direction: column; gap: 10px; }
  .rev { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; font-size: 13px; line-height: 1.45; display: flex; flex-direction: column; gap: 4px; }
  .rev .who { color: var(--muted); font-size: 12px; }
  .buy { height: 44px; border-radius: 10px; border: 0; background: var(--accent); color: var(--accent-text); font: 600 14px var(--font); cursor: pointer; padding: 0 18px; align-self: flex-start; }
  @keyframes pulse { 50% { opacity: .55; } }
  @media (prefers-reduced-motion: reduce) { .skel { animation: none; } }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="head">
    <div class="title"><h1 id="heading">Ищу товары…</h1></div>
  </div>
  <div class="rail" id="rail"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
</div>
<!--EXT_APPS_BUNDLE-->
<script>
(function () {
  "use strict";
  var SOURCE_NAMES = {
    wildberries: "Wildberries", yandex_market: "Яндекс Маркет", ozon: "Ozon", avito: "Авито",
    taobao: "Taobao", megamarket: "Мегамаркет", lamoda: "Lamoda", dns: "DNS", citilink: "Ситилинк",
    aliexpress: "AliExpress", detsky_mir: "Детский мир"
  };
  var state = { data: null, query: "", source: "all", sort: "reviews", detail: null };
  if (!window.ExtApps || !window.ExtApps.App) { document.getElementById("heading").textContent = "Не удалось загрузить карточки"; return; }
  var app = new window.ExtApps.App({ name: "marketplace-cards", version: "1.1.0" }, { availableDisplayModes: ["inline"] }, { autoResize: true });

  var connected = false;
  function log(stage, detail) {
    if (!connected) return;
    try {
      app.callServerTool({ name: "compare_ui_log", arguments: { stage: String(stage).slice(0, 40), detail: String(detail || "").slice(0, 200) } }).catch(function () {});
    } catch (e) {}
  }
  window.addEventListener("error", function (e) { log("error", (e && e.message) || "error"); });

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function fmtRub(v) {
    if (v == null || isNaN(v)) return "";
    return Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " ₽";
  }
  function reviewsWord(n) {
    var a = n % 10, b = n % 100;
    if (a === 1 && b !== 11) return "отзыв";
    if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return "отзыва";
    return "отзывов";
  }
  function score(o) {
    if (o.rating == null) return -1;
    var c = o.rating_count || 0;
    return (o.rating * c + 4.0 * 30) / (c + 30);
  }
  function safeUrl(u) {
    return typeof u === "string" && /^https:\/\//i.test(u) ? u : "";
  }
  function openLink(url) {
    if (!url) return;
    app.openLink({ url: url }).catch(function () {
      try { window.open(url, "_blank", "noopener"); } catch (e) {}
    });
  }
  function starSvg() {
    var ns = "http://www.w3.org/2000/svg";
    var s = document.createElementNS(ns, "svg");
    s.setAttribute("width", "13"); s.setAttribute("height", "13"); s.setAttribute("viewBox", "0 0 24 24");
    s.setAttribute("aria-hidden", "true");
    var p = document.createElementNS(ns, "path");
    p.setAttribute("fill", "var(--star)");
    p.setAttribute("d", "M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z");
    s.appendChild(p);
    return s;
  }
  function placeholderSvg() {
    var ns = "http://www.w3.org/2000/svg";
    var s = document.createElementNS(ns, "svg");
    s.setAttribute("width", "40"); s.setAttribute("height", "40"); s.setAttribute("viewBox", "0 0 24 24");
    s.setAttribute("fill", "none"); s.setAttribute("stroke", "currentColor"); s.setAttribute("stroke-width", "1.5");
    s.setAttribute("aria-hidden", "true"); s.style.color = "var(--muted)";
    var p = document.createElementNS(ns, "path");
    p.setAttribute("d", "M3 7l9-4 9 4v10l-9 4-9-4z M3 7l9 4 9-4 M12 11v10");
    s.appendChild(p);
    return s;
  }

  function pill(label, pressed, onClick) {
    var b = el("button", "pill", label);
    b.type = "button";
    b.setAttribute("aria-pressed", pressed ? "true" : "false");
    b.addEventListener("click", onClick);
    return b;
  }

  function render() {
    var root = document.getElementById("app");
    root.textContent = "";
    if (state.detail) { renderDetail(root); return; }
    var d = state.data;
    var offers = (d && Array.isArray(d.offers)) ? d.offers.filter(function (o) { return o && o.title; }) : [];
    var okSources = (d && d.sources_ok) || [];
    var failed = (d && d.source_outcomes || []).filter(function (s) { return s.status !== "ok"; }).map(function (s) { return s.source; });

    var head = el("div", "head");
    var title = el("div", "title");
    title.appendChild(el("h1", null, state.query ? "«" + state.query + "»" : "Товары"));
    okSources.forEach(function (s) { title.appendChild(el("span", "chip", SOURCE_NAMES[s] || s)); });
    if (failed.length) {
      title.appendChild(el("span", "chip", "Не ответили: " + failed.map(function (s) { return SOURCE_NAMES[s] || s; }).join(", ")));
    }
    head.appendChild(title);

    var controls = el("div", "controls");
    var present = [];
    offers.forEach(function (o) { if (present.indexOf(o.source) < 0) present.push(o.source); });
    if (present.length > 1) {
      controls.appendChild(pill("Все", state.source === "all", function () { state.source = "all"; render(); }));
      present.forEach(function (s) {
        controls.appendChild(pill(SOURCE_NAMES[s] || s, state.source === s, function () { state.source = s; render(); }));
      });
      controls.appendChild(el("div", "sep"));
    }
    controls.appendChild(pill("По отзывам", state.sort === "reviews", function () { state.sort = "reviews"; render(); }));
    controls.appendChild(pill("По цене", state.sort === "price", function () { state.sort = "price"; render(); }));
    head.appendChild(controls);
    root.appendChild(head);

    var list = offers.filter(function (o) { return state.source === "all" || o.source === state.source; });
    var best = null, cheapest = null;
    offers.forEach(function (o) {
      if (o.rating != null && (best === null || score(o) > score(best))) best = o;
      if (o.price_rub != null && (cheapest === null || o.price_rub < cheapest.price_rub)) cheapest = o;
    });
    list.sort(function (a, b) {
      if (state.sort === "price") {
        var pa = a.price_rub == null ? Infinity : a.price_rub, pb = b.price_rub == null ? Infinity : b.price_rub;
        return pa - pb;
      }
      return score(b) - score(a);
    });

    var rail = el("div", "rail");
    if (!list.length) {
      rail.appendChild(el("div", "empty", d ? "Ничего не нашлось — площадки не ответили или товаров нет." : "Загружаю…"));
    }
    list.forEach(function (o) {
      var card = el("div", "card");
      var pic = el("div", "pic");
      var img = safeUrl(o.image);
      if (img) {
        var im = document.createElement("img");
        im.src = img; im.alt = ""; im.loading = "lazy"; im.referrerPolicy = "no-referrer";
        im.addEventListener("error", function () { pic.replaceChild(placeholderSvg(), im); });
        pic.appendChild(im);
      } else {
        pic.appendChild(placeholderSvg());
      }
      var badges = el("div", "badges");
      if (o === best) badges.appendChild(el("span", "badge", "Лучший по отзывам"));
      if (o === cheapest && offers.length > 1) badges.appendChild(el("span", "badge price", "Дешевле всех"));
      if (badges.childNodes.length) pic.appendChild(badges);
      card.appendChild(pic);

      var body = el("div", "body");
      var name = el("div", "name", o.title);
      name.title = o.title;
      body.appendChild(name);
      if (o.rating != null) {
        var r = el("div", "rating");
        r.appendChild(starSvg());
        r.appendChild(el("strong", null, Number(o.rating).toFixed(1).replace(".", ",")));
        if (o.rating_count) {
          r.appendChild(el("span", "count", "· " + o.rating_count.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " " + reviewsWord(o.rating_count)));
        }
        body.appendChild(r);
      }
      if (o.price_rub != null) {
        body.appendChild(el("div", "price-now", fmtRub(o.price_rub)));
      } else if (o.price_native != null) {
        body.appendChild(el("div", "price-now", o.price_native + " " + (o.currency || "").toUpperCase()));
      }
      if (o.price_with_subscription_rub != null && o.price_with_subscription_rub < (o.price_rub || Infinity)) {
        body.appendChild(el("div", "sub", "с Плюсом " + fmtRub(o.price_with_subscription_rub)));
      }
      body.appendChild(el("div", "src", SOURCE_NAMES[o.source] || o.source));
      body.appendChild(el("div", "grow"));
      var b = el("button", "open", "Подробнее");
      b.type = "button";
      body.appendChild(b);
      card.addEventListener("click", function () { openDetail(o); });
      card.appendChild(body);
      rail.appendChild(card);
    });
    root.appendChild(rail);

    if (d) {
      var foot = el("div", "foot");
      var now = new Date();
      foot.appendChild(el("span", null, "Цены на " + now.toLocaleDateString("ru-RU", { day: "numeric", month: "long" }) + " · без подписок"));
      if (d.complete === false && okSources.length) foot.appendChild(el("span", null, "Сравнение неполное"));
      root.appendChild(foot);
    }
  }

  function openDetail(o) {
    var canFetch = o.source === "yandex_market" && o.product_id;
    state.detail = { offer: o, loading: !!canFetch, data: null, error: false };
    render();
    try { window.scrollTo(0, 0); } catch (e) {}
    log("detail", o.source + ":" + (o.product_id || ""));
    if (!canFetch) return;
    var current = state.detail;
    app.callServerTool({ name: "compare_product_details", arguments: { source: o.source, product_id: String(o.product_id) } })
      .then(function (res) {
        if (state.detail !== current) return;
        var data = res && res.structuredContent;
        current.loading = false;
        if (res && res.isError || !data || data.supported === false) { current.error = true; } else { current.data = data; }
        render();
      })
      .catch(function (e) {
        if (state.detail !== current) return;
        current.loading = false; current.error = true; render();
        log("detail_error", (e && e.message) || "error");
      });
  }

  function renderDetail(root) {
    var det = state.detail, o = det.offer, d = det.data || {};
    var box = el("div", "detail");
    var back = el("button", "back", "← Ко всем товарам");
    back.type = "button";
    back.addEventListener("click", function () { state.detail = null; render(); });
    box.appendChild(back);

    var top = el("div", "dtop");
    var pic = el("div", "dpic");
    var imgUrl = safeUrl(d.image) || safeUrl(o.image);
    if (imgUrl) {
      var im = document.createElement("img");
      im.src = imgUrl; im.alt = ""; im.referrerPolicy = "no-referrer";
      im.addEventListener("error", function () { pic.replaceChild(placeholderSvg(), im); });
      pic.appendChild(im);
    } else { pic.appendChild(placeholderSvg()); }
    top.appendChild(pic);

    var info = el("div", "dinfo");
    info.appendChild(el("h2", null, d.title || o.title));
    var price = d.price_rub != null ? d.price_rub : o.price_rub;
    if (price != null) {
      var pr = el("div", "dprice");
      pr.appendChild(el("span", "now", fmtRub(price)));
      if (d.price_before_discount_rub && d.price_before_discount_rub > price) pr.appendChild(el("span", "old", fmtRub(d.price_before_discount_rub)));
      if (d.discount_percent) pr.appendChild(el("span", "off", "−" + d.discount_percent + "%"));
      info.appendChild(pr);
    }
    var plus = d.price_with_plus != null ? d.price_with_plus : o.price_with_subscription_rub;
    if (plus != null && price != null && plus < price) info.appendChild(el("div", "meta", "с Яндекс Плюсом " + fmtRub(plus)));
    var rating = d.rating != null ? d.rating : o.rating;
    var count = d.rating_count != null ? d.rating_count : o.rating_count;
    if (rating != null) {
      var r = el("div", "rating");
      r.appendChild(starSvg());
      r.appendChild(el("strong", null, Number(rating).toFixed(1).replace(".", ",")));
      if (count) r.appendChild(el("span", "count", "· " + String(count).replace(/\B(?=(\d{3})+(?!\d))/g, "\u00a0") + " " + reviewsWord(count)));
      info.appendChild(r);
    }
    var stars = d.rating_stars || {};
    var total = 0; ["1", "2", "3", "4", "5"].forEach(function (k) { total += Number(stars[k] || 0); });
    if (total > 0) {
      var bars = el("div", "bars");
      ["5", "4", "3", "2", "1"].forEach(function (k) {
        var n = Number(stars[k] || 0);
        var row = el("div", "bar");
        row.appendChild(el("span", null, k + "★"));
        var track = el("div", "track"); var fill = el("div", "fill");
        fill.style.width = Math.round(n * 100 / total) + "%";
        track.appendChild(fill); row.appendChild(track);
        row.appendChild(el("span", null, String(n)));
        bars.appendChild(row);
      });
      info.appendChild(bars);
    }
    var metaBits = [];
    if (d.seller || o.seller) metaBits.push("Продавец: " + (d.seller || o.seller));
    if (d.offers_count) metaBits.push("предложений: " + d.offers_count);
    metaBits.push(SOURCE_NAMES[o.source] || o.source);
    info.appendChild(el("div", "meta", metaBits.join(" · ")));
    var url = safeUrl(d.url) || safeUrl(o.url);
    if (url) {
      var buy = el("button", "buy", "Купить на " + (o.source === "yandex_market" ? "Маркете" : (SOURCE_NAMES[o.source] || "сайте")));
      buy.type = "button";
      buy.addEventListener("click", function () { log("buy", o.source + ":" + (o.product_id || "")); openLink(url); });
      info.appendChild(buy);
    }
    top.appendChild(info);
    box.appendChild(top);

    if (det.loading) box.appendChild(el("div", "meta", "Загружаю описание и отзывы…"));
    if (det.error) box.appendChild(el("div", "meta", "Подробности сейчас не загрузились — основное выше, остальное на странице товара."));
    if (d.description) {
      box.appendChild(el("div", "sec", "Описание"));
      box.appendChild(el("div", "desc", d.description));
    }
    if (Array.isArray(d.reviews) && d.reviews.length) {
      box.appendChild(el("div", "sec", "Отзывы покупателей"));
      var list = el("div", "reviews");
      d.reviews.forEach(function (rv) {
        var item = el("div", "rev");
        item.appendChild(el("div", "who", [rv.author, rv.rating ? rv.rating + "★" : "", rv.date].filter(Boolean).join(" · ")));
        if (rv.pros) item.appendChild(el("div", null, "Плюсы: " + rv.pros));
        if (rv.cons) item.appendChild(el("div", null, "Минусы: " + rv.cons));
        if (rv.comment) item.appendChild(el("div", null, rv.comment));
        list.appendChild(item);
      });
      box.appendChild(list);
    }
    root.appendChild(box);
  }

  function applyContext(ctx) {
    if (!ctx) return;
    if (ctx.theme === "dark" || ctx.theme === "light") document.documentElement.setAttribute("data-theme", ctx.theme);
    var vars = ctx.styles && ctx.styles.variables;
    if (vars) {
      Object.keys(vars).forEach(function (k) { if (vars[k]) document.documentElement.style.setProperty(k, vars[k]); });
    }
  }

  function takeResult(params) {
    var data = params && params.structuredContent;
    if (!data && params && Array.isArray(params.content)) {
      for (var i = 0; i < params.content.length; i++) {
        var c = params.content[i];
        if (c && c.type === "text") { try { data = JSON.parse(c.text); break; } catch (e) {} }
      }
    }
    if (data && typeof data === "object") {
      if (data.result && data.offers === undefined) data = data.result;
      state.data = data;
      if (data.query) state.query = data.query;
      state.detail = null;
      render();
      log("rendered", (Array.isArray(data.offers) ? data.offers.length : 0) + " offers");
    }
  }

  app.ontoolinput = function (params) {
    var args = params && params.arguments;
    if (args && args.query) {
      state.query = String(args.query);
      var h = document.getElementById("heading");
      if (h) h.textContent = "Ищу «" + state.query + "»…";
    }
  };
  app.ontoolresult = function (result) { takeResult(result); };
  app.onhostcontextchanged = function (ctx) { applyContext(ctx); };

  if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
    document.documentElement.setAttribute("data-theme", "dark");
  }

  app.connect().then(function () {
    connected = true;
    applyContext(app.getHostContext());
    var hv = app.getHostVersion ? app.getHostVersion() : null;
    log("connected", hv ? (hv.name + "/" + hv.version) : "");
  }).catch(function (e) {
    if (window.console) console.error("marketplace-cards: connect failed", e);
  });
})();
</script>
</body>
</html>
